<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Spirit Core · Whisky Guide</title>
<meta name="theme-color" content="#060606">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SPIRIT CORE LAB">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<!-- Supabase JS Client -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#060606;overflow-x:hidden}
body{font-family:'Pretendard Variable','Pretendard',-apple-system,BlinkMacSystemFont,system-ui,sans-serif;color:#f1f1f1;font-weight:600;letter-spacing:-.01em}
::-webkit-scrollbar{width:3px}
::-webkit-scrollbar-track{background:#0e0e0e}
::-webkit-scrollbar-thumb{background:#2a2a2a}
@keyframes fin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%,100%{opacity:.25}50%{opacity:.75}}
@keyframes glint{0%,100%{opacity:.6}50%{opacity:1}}
.fadein{animation:fin .32s ease forwards}
.pulse{animation:pulse 2.8s ease-in-out infinite}
.glint{animation:glint 3.5s ease-in-out infinite}
.scr{min-height:100vh;background:#060606}
:root{--text:#f1f1f1;--text-2:#bdbdbd;--text-3:#8f8f8f;--burgundy:#8f0f2f;--burgundy-hi:#d83a63;--line:#252525}
.logo-main{width:min(84vw,430px);height:auto;aspect-ratio:1/1;display:block;object-fit:contain;filter:drop-shadow(0 0 6px rgba(216,58,99,.18)) drop-shadow(0 0 14px rgba(216,58,99,.10));}
.logo-sm{width:64px;height:64px;display:block;object-fit:contain;filter:drop-shadow(0 0 4px rgba(216,58,99,.20)) drop-shadow(0 0 10px rgba(216,58,99,.10));}

.logo-wrap{position:relative;display:inline-flex;align-items:center;justify-content:center;isolation:isolate}
.logo-wrap::before{content:'';position:absolute;inset:16% 14%;border-radius:50%;background:radial-gradient(circle, rgba(216,58,99,.18) 0%, rgba(216,58,99,.10) 28%, rgba(216,58,99,.05) 48%, rgba(216,58,99,0) 72%);filter:blur(18px);z-index:0;pointer-events:none}
.logo-wrap img{position:relative;z-index:1}
.logo-wrap-sm::before{inset:18% 16%;filter:blur(10px);background:radial-gradient(circle, rgba(216,58,99,.15) 0%, rgba(216,58,99,.08) 32%, rgba(216,58,99,0) 72%)}
.home-logo-btn{display:inline-flex;align-items:center;justify-content:center;background:none;border:0;padding:0;margin:0;cursor:pointer;line-height:0;flex-shrink:0;opacity:.96;transition:opacity .18s ease,transform .18s ease,filter .18s ease}
.home-logo-btn:hover,.home-logo-btn:active{opacity:1;transform:translateY(-1px);filter:brightness(1.08)}


.splash-screen{background:#0a0a0a!important;filter:brightness(1.04);}
.splash-screen .logo-main{filter:drop-shadow(0 0 8px rgba(216,58,99,.22)) drop-shadow(0 0 18px rgba(216,58,99,.10));}
.status-chip{display:inline-flex;align-items:center;justify-content:center;padding:3px 9px;border-radius:999px;font-size:13px;letter-spacing:.06em;font-weight:700;}
.status-visible{background:#102015;color:#65c47a;border:1px solid #224a2c;}
.status-hidden{background:#241014;color:#d85a72;border:1px solid #4a1a28;}

.hdr{display:flex;align-items:center;padding:14px 18px;border-bottom:1px solid #1a1a1a;background:#060606;position:sticky;top:0;z-index:10;gap:12px}
.card{border:1px solid #1e1e1e;border-radius:6px;padding:16px 18px;background:#0e0e0e;transition:background .15s,border-color .15s;cursor:pointer}
.card:hover,.card:active{background:#141414;border-color:#2e2e2e}
.btn{font-weight:600;background:none;border:1px solid #2a2a2a;color:#b8b8b8;padding:6px 14px;font-size:14px;letter-spacing:.2em;cursor:pointer;border-radius:3px;transition:all .2s;font-family:inherit}
.btn:hover{border-color:#b0b0b0;color:#bbb}
.btn-gold{border-color:#4a1524;color:#d83a63}
.btn-gold:hover{background:#1a0810;border-color:#d83a63;color:#f06f8f}
.btn-red{border-color:#3a1414;color:#aa4040}
.btn-red:hover{background:#1a0808;border-color:#883030;color:#cc5555}
.tag{font-weight:600;display:inline-block;padding:2px 8px;border-radius:3px;font-size:13px;letter-spacing:.06em;white-space:nowrap}
.sep{font-size:13px;color:#777777;letter-spacing:.26em;padding:12px 0 5px;border-top:1px solid #1a1a1a;margin-top:6px}
.pin-btn{font-weight:600;width:68px;height:68px;background:#0e0e0e;border:1px solid #222;color:#f1f1f1;font-size:26px;font-family:inherit;cursor:pointer;border-radius:6px;transition:background .12s,border-color .12s}
.pin-btn:hover,.pin-btn:active{background:#181818;border-color:#777777}
input[type=text],select{font-weight:500;background:#111;color:#f1f1f1;border:1px solid #2a2a2a;border-radius:4px;padding:8px 10px;font-size:16px;font-family:inherit;outline:none;width:100%;transition:border-color .2s}
input[type=text]:focus,select:focus{border-color:#d83a63}

.bottle-card{display:grid;grid-template-columns:108px minmax(0,1fr);gap:14px;align-items:flex-start;}
.bottle-img-wrap{width:108px;height:168px;border:1px solid #242424;border-radius:8px;background:linear-gradient(180deg,#151515,#080808);display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative;flex-shrink:0;}
.bottle-img{width:100%;height:100%;max-width:100%;max-height:100%;object-fit:contain;object-position:center center;padding:4px;display:block;}
.bottle-img-fallback{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:8px;font-size:11px;line-height:1.35;color:#5e5e5e;letter-spacing:.08em;background:linear-gradient(180deg,#111,#080808);}
.bottle-img-wrap.has-img .bottle-img-fallback{display:none;}

.bottle-img-missing{position:absolute;inset:0;align-items:center;justify-content:center;text-align:center;padding:8px;font-size:12px;line-height:1.45;color:#d83a63;letter-spacing:.08em;background:linear-gradient(180deg,#111,#080808);}

.bilingual-tag{line-height:1.35;}
@media(max-width:420px){.bottle-card{grid-template-columns:86px minmax(0,1fr);gap:11px}.bottle-img-wrap{width:86px;height:138px}}



/* ═══════════════ SPIRIT CORE REFINEMENT v2 ═══════════════ */
:root{
  --bg:#050505;
  --bg-2:#080607;
  --panel:#0d0d0e;
  --panel-hi:#151214;
  --ink:#f4f0ea;
  --muted:#b7aaa6;
  --dim:#6f6766;
  --wine:#8f0f2f;
  --wine-2:#d83a63;
  --wine-deep:#360713;
  --brass:#b68a4c;
  --brass-soft:#d7b678;
  --hair:rgba(255,255,255,.095);
  --hair-2:rgba(216,58,99,.24);
  --shadow:0 22px 60px rgba(0,0,0,.48);
}
html,body{background:var(--bg)!important;color:var(--ink)!important;}
body{
  font-weight:520!important;
  text-rendering:geometricPrecision;
  -webkit-font-smoothing:antialiased;
  background:
    radial-gradient(circle at 50% -8%, rgba(216,58,99,.18), transparent 34%),
    radial-gradient(circle at 12% 16%, rgba(182,138,76,.065), transparent 28%),
    linear-gradient(180deg,#090708 0%,#050505 58%,#030303 100%)!important;
}
body::before{
  content:'';
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:0;
  opacity:.19;
  background-image:
    linear-gradient(rgba(255,255,255,.022) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.018) 1px,transparent 1px),
    radial-gradient(circle at center,rgba(255,255,255,.045) 0 1px,transparent 1.2px);
  background-size:44px 44px,44px 44px,5px 5px;
  mask-image:linear-gradient(180deg,rgba(0,0,0,.85),rgba(0,0,0,.25));
}
#app{position:relative;z-index:1;}
.scr{
  background:
    radial-gradient(circle at 50% 0%,rgba(216,58,99,.13),transparent 30%),
    radial-gradient(circle at 92% 12%,rgba(182,138,76,.055),transparent 24%),
    linear-gradient(180deg,#080607 0%,#050505 100%)!important;
}
.fadein{animation:fin .38s cubic-bezier(.2,.72,.24,1) forwards!important;}
@keyframes fin{from{opacity:0;transform:translateY(10px) scale(.995)}to{opacity:1;transform:translateY(0) scale(1)}}
.hdr{
  min-height:76px;
  padding:12px 16px!important;
  border-bottom:1px solid rgba(255,255,255,.075)!important;
  background:linear-gradient(180deg,rgba(12,10,11,.91),rgba(6,6,6,.78))!important;
  backdrop-filter:blur(18px) saturate(130%);
  -webkit-backdrop-filter:blur(18px) saturate(130%);
  box-shadow:0 16px 34px rgba(0,0,0,.36);
}
.hdr::after{
  content:'';
  position:absolute;
  left:18px;right:18px;bottom:-1px;height:1px;
  background:linear-gradient(90deg,transparent,rgba(216,58,99,.55),rgba(182,138,76,.23),transparent);
  pointer-events:none;
}
.hdr .logo-sm{width:48px!important;height:48px!important;filter:drop-shadow(0 0 10px rgba(216,58,99,.16))!important;}
.logo-main{filter:drop-shadow(0 0 10px rgba(216,58,99,.20)) drop-shadow(0 0 30px rgba(216,58,99,.08))!important;}
.logo-wrap::before{opacity:.8!important;filter:blur(22px)!important;}
.splash-screen{
  background:
    radial-gradient(circle at 50% 38%,rgba(216,58,99,.20),transparent 30%),
    radial-gradient(circle at 50% 52%,rgba(182,138,76,.055),transparent 38%),
    linear-gradient(180deg,#0b0809 0%,#050505 100%)!important;
}
.splash-screen::before{
  content:'';
  position:absolute;
  inset:24px;
  border:1px solid rgba(255,255,255,.055);
  border-radius:22px;
  pointer-events:none;
  box-shadow:inset 0 0 0 1px rgba(216,58,99,.035),inset 0 0 80px rgba(216,58,99,.035);
}
.splash-cta,
.btn{
  border-radius:999px!important;
  border:1px solid rgba(216,58,99,.34)!important;
  background:linear-gradient(180deg,rgba(216,58,99,.075),rgba(30,7,14,.44))!important;
  color:#f2c4cf!important;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 12px 28px rgba(0,0,0,.26)!important;
}
.splash-cta:hover,.btn:hover{border-color:rgba(216,58,99,.72)!important;background:linear-gradient(180deg,rgba(216,58,99,.13),rgba(30,7,14,.60))!important;color:#fff2f5!important;}
.card,
.whisky-card{
  position:relative;
  overflow:hidden;
  border-radius:14px!important;
  border:1px solid rgba(255,255,255,.078)!important;
  background:
    linear-gradient(135deg,rgba(255,255,255,.055),rgba(255,255,255,.014) 44%,rgba(216,58,99,.035)),
    linear-gradient(180deg,#121012,#090909)!important;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.055),0 14px 36px rgba(0,0,0,.34)!important;
}
.card::before,
.whisky-card::before{
  content:'';
  position:absolute;
  inset:0 0 auto 0;
  height:1px;
  background:linear-gradient(90deg,transparent,rgba(216,58,99,.46),rgba(182,138,76,.24),transparent);
  opacity:.74;
  pointer-events:none;
}
.card::after,
.whisky-card::after{
  content:'';
  position:absolute;
  right:-58px;top:-58px;
  width:150px;height:150px;
  background:radial-gradient(circle,rgba(216,58,99,.10),transparent 62%);
  pointer-events:none;
}
.card:hover,.card:active,.whisky-card:hover,.whisky-card:active{
  transform:translateY(-1px);
  border-color:rgba(216,58,99,.22)!important;
  background:
    linear-gradient(135deg,rgba(255,255,255,.072),rgba(255,255,255,.018) 44%,rgba(216,58,99,.055)),
    linear-gradient(180deg,#171315,#0b0b0b)!important;
}
.guide-intro{
  margin:14px 16px 10px;
  padding:18px;
  border-radius:18px;
  border:1px solid rgba(255,255,255,.075);
  background:
    linear-gradient(135deg,rgba(216,58,99,.105),rgba(255,255,255,.025) 42%,rgba(182,138,76,.06)),
    linear-gradient(180deg,#100d0f,#080808);
  box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.06);
  position:relative;
  overflow:hidden;
}
.guide-intro::before{content:'';position:absolute;inset:0 0 auto 0;height:1px;background:linear-gradient(90deg,transparent,rgba(216,58,99,.65),rgba(182,138,76,.35),transparent);}
.guide-kicker{font-size:11px;color:var(--brass-soft);letter-spacing:.26em;margin-bottom:7px;font-weight:750;}
.guide-title{font-size:22px;color:var(--ink);letter-spacing:.025em;line-height:1.25;margin-bottom:6px;font-weight:760;}
.guide-copy{font-size:14px;color:var(--muted);line-height:1.62;font-weight:480;margin-bottom:14px;}
.guide-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px;}
.guide-stat{border:1px solid rgba(255,255,255,.065);border-radius:12px;background:rgba(0,0,0,.22);padding:10px 8px;text-align:center;}
.guide-stat strong{display:block;font-size:17px;color:#f6e8ec;letter-spacing:.04em;font-weight:760;}
.guide-stat span{display:block;margin-top:3px;font-size:10px;color:var(--dim);letter-spacing:.16em;white-space:nowrap;}
.search-shell{position:relative;margin-top:14px;}
.search-shell::before{content:'⌕';position:absolute;left:13px;top:50%;transform:translateY(-54%);color:rgba(216,58,99,.78);font-size:17px;z-index:2;}
.search-shell input{padding-left:38px!important;}
input[type=text],select{
  height:44px;
  border-radius:999px!important;
  border:1px solid rgba(255,255,255,.09)!important;
  background:linear-gradient(180deg,#121012,#0a0a0a)!important;
  color:#f5eeee!important;
  font-weight:520!important;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.045),0 12px 28px rgba(0,0,0,.22)!important;
}
input[type=text]::placeholder{color:#655d5f!important;font-weight:480;}
input[type=text]:focus,select:focus{border-color:rgba(216,58,99,.58)!important;box-shadow:0 0 0 3px rgba(216,58,99,.09),inset 0 1px 0 rgba(255,255,255,.06)!important;}
.tag{
  border-radius:999px!important;
  padding:4px 9px!important;
  border:1px solid currentColor!important;
  background:color-mix(in srgb,currentColor 11%,#0b0b0b 89%)!important;
  opacity:.94;
  font-size:11.5px!important;
  font-weight:700!important;
  letter-spacing:.045em!important;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.045);
}
.bottle-img-wrap{
  border-radius:13px!important;
  border:1px solid rgba(255,255,255,.085)!important;
  background:
    radial-gradient(circle at 50% 22%,rgba(255,255,255,.065),transparent 42%),
    linear-gradient(180deg,#181517,#070707)!important;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.05),0 14px 26px rgba(0,0,0,.28);
}
.bottle-img-wrap::after{content:'';position:absolute;left:13%;right:13%;bottom:8%;height:16px;background:radial-gradient(ellipse,rgba(0,0,0,.42),transparent 70%);pointer-events:none;}
.bottle-img{filter:drop-shadow(0 14px 18px rgba(0,0,0,.46));}
.sep{
  border-top:1px solid rgba(255,255,255,.07)!important;
  color:#9f878e!important;
  letter-spacing:.22em!important;
  font-size:11.5px!important;
  margin:14px 0 8px!important;
  padding-top:14px!important;
}
.result-hero{
  margin:14px 16px 10px;
  border-radius:16px;
  border:1px solid rgba(255,255,255,.075);
  background:linear-gradient(135deg,rgba(216,58,99,.08),rgba(255,255,255,.018)),linear-gradient(180deg,#100d0e,#080808);
  padding:15px 16px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.055),0 12px 30px rgba(0,0,0,.28);
}
.result-hero p{font-weight:470;}
.result-count-pill{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-width:58px;
  height:30px;
  border-radius:999px;
  border:1px solid rgba(216,58,99,.34);
  background:rgba(216,58,99,.075);
  color:#f0b7c5;
  font-size:13px;
  letter-spacing:.08em;
}
.pin-btn{border-radius:16px!important;background:linear-gradient(180deg,#131113,#080808)!important;border-color:rgba(255,255,255,.09)!important;box-shadow:inset 0 1px 0 rgba(255,255,255,.05),0 14px 26px rgba(0,0,0,.24);}
.status-chip{border-radius:999px!important;}
@media(max-width:420px){
  .hdr{min-height:68px;padding:10px 14px!important;}
  .hdr .logo-sm{width:42px!important;height:42px!important;}
  .guide-intro{margin:12px 12px 8px;padding:16px;}
  .guide-title{font-size:20px;}
  .guide-copy{font-size:13.5px;}
  .guide-stats{gap:6px;}
  .guide-stat{padding:8px 4px;}
  .guide-stat strong{font-size:15px;}
  .guide-stat span{font-size:9.5px;letter-spacing:.1em;}
  .card,.whisky-card{border-radius:13px!important;}
  .tag{font-size:10.8px!important;padding:3px 7px!important;}
}
@supports not (background:color-mix(in srgb,#fff 10%,#000 90%)){
  .tag{background:#101010!important;}
}



/* ═══════════════ SHARP PREMIUM REFINEMENT + DETAIL MODAL ═══════════════ */
.splash-screen::before,
.guide-intro,
.result-hero,
.card,
.whisky-card,
.bottle-img-wrap,
input[type=text],
select,
.btn,
.splash-cta,
.pin-btn,
.result-count-pill{
  border-radius:4px!important;
}
.tag,
.status-chip{
  border-radius:2px!important;
}
.guide-stats{display:none!important;}
.guide-copy{margin-bottom:10px!important;}
.search-shell{margin-top:12px!important;}
.card,
.whisky-card{
  box-shadow:inset 0 1px 0 rgba(255,255,255,.045),0 12px 30px rgba(0,0,0,.32)!important;
}
.card:hover,.card:active,.whisky-card:hover,.whisky-card:active{
  transform:none!important;
}
.result-card,.search-card{cursor:zoom-in;}
.detail-hint{
  margin-top:10px;
  padding-top:9px;
  border-top:1px solid rgba(255,255,255,.055);
  font-size:11px;
  color:#7d5d66;
  letter-spacing:.22em;
  font-weight:700;
}
.detail-layer{
  position:fixed;
  inset:0;
  z-index:9999;
  background:rgba(3,3,3,.88);
  backdrop-filter:blur(18px) saturate(120%);
  -webkit-backdrop-filter:blur(18px) saturate(120%);
  overflow:auto;
  animation:detailFade .16s ease-out;
}
@keyframes detailFade{from{opacity:0}to{opacity:1}}
.detail-panel{
  width:min(940px,calc(100vw - 24px));
  margin:14px auto 36px;
  border:1px solid rgba(255,255,255,.10);
  border-radius:4px;
  background:
    linear-gradient(135deg,rgba(216,58,99,.072),rgba(255,255,255,.018) 38%,rgba(182,138,76,.05)),
    linear-gradient(180deg,#100d0f 0%,#070707 100%);
  box-shadow:0 30px 90px rgba(0,0,0,.66),inset 0 1px 0 rgba(255,255,255,.055);
  overflow:hidden;
}
.detail-top{
  position:sticky;
  top:0;
  z-index:2;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  padding:13px 15px;
  border-bottom:1px solid rgba(255,255,255,.075);
  background:linear-gradient(180deg,rgba(13,11,12,.96),rgba(7,7,7,.88));
  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);
}
.detail-top p:first-child{font-size:11px;color:#b68a4c;letter-spacing:.24em;margin-bottom:2px;font-weight:760;}
.detail-top p:last-child{font-size:13px;color:#7c7473;letter-spacing:.08em;margin:0;font-weight:520;}
.detail-close{
  border:1px solid rgba(255,255,255,.12);
  background:rgba(0,0,0,.18);
  color:#cfc4c2;
  width:38px;
  height:38px;
  border-radius:4px;
  font-size:22px;
  line-height:1;
  cursor:pointer;
}
.detail-hero{
  display:grid;
  grid-template-columns:168px minmax(0,1fr);
  gap:18px;
  padding:18px;
  border-bottom:1px solid rgba(255,255,255,.065);
}
.detail-bottle .bottle-img-wrap{width:168px!important;height:252px!important;border-radius:4px!important;}
.detail-name{font-size:26px;color:#f6f0ed;letter-spacing:.01em;line-height:1.18;margin:2px 0 7px;font-weight:760;}
.detail-origin{font-size:14px;color:#b7aaa6;letter-spacing:.08em;margin:0 0 13px;font-weight:520;}
.detail-tags{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0;}
.detail-summary{
  margin-top:13px;
  border:1px solid rgba(255,255,255,.07);
  border-radius:4px;
  background:rgba(0,0,0,.18);
  padding:12px 13px;
  color:#b7aaa6;
  font-size:14px;
  line-height:1.62;
  font-weight:480;
}
.detail-section-title{
  padding:15px 18px 8px;
  font-size:12px;
  color:#9f878e;
  letter-spacing:.22em;
  font-weight:760;
}

{id:"Blended",ko:"블렌디드",desc:"몰트 위스키 원액과 연속식 증류기로 대량 생산한 그레인 위스키를 황금 비율로 혼합한 위스키입니다. 전 세계 소비량이 가장 많으며 부드러운 목 넘김과 일관된 맛을 자랑합니다."},
{id:"Bourbon / Corn-Based",ko:"버번 / 콘 기반",desc:"버번과 콘 위스키처럼 옥수수 비중이 높은 아메리칸 계열을 묶은 실용 분류입니다. 버번은 옥수수 51% 이상과 새로 태운 오크통 숙성이 핵심이며, 바닐라·카라멜·토스티한 오크 풍미가 선명합니다. 테네시 위스키는 별도 축으로 분리했습니다."},
{id:"Tennessee Whiskey",ko:"테네시 위스키",desc:"버번과 유사한 옥수수 기반 위스키이지만, 테네시 지역성과 사탕단풍나무 숯 여과인 링컨 카운티 프로세스가 정체성의 핵심입니다. Jack Daniel’s와 George Dickel 계열처럼 바닐라·카라멜·나무 향 위에 더 매끄러운 숯 여과 질감이 나타납니다."},
{id:"Rye",ko:"라이 위스키",desc:"호밀(Rye)을 최소 51% 이상 사용한 위스키입니다. 버번보다 확연히 드라이하고, 후추·정향·시나몬 같은 알싸한 향신료 향이 전면에 나서는 게 가장 큰 특징입니다. 달콤함보다 날카로움을 즐기는 분들에게 잘 맞으며, 맨해튼·올드패션드 같은 클래식 칵테일의 베이스로도 최적입니다. 미국 라이는 스파이시하고 타이트한 반면, 캐나다 라이는 부드럽고 둥근 편이라 같은 카테고리 안에서도 스타일 차이가 큽니다."},
{id:"Wheat",ko:"밀 위스키",desc:"밀(Wheat)을 주원료로 삼은 위스키입니다. 곡물 위스키 중 가장 자극이 적고, 갓 구운 빵·크림·바닐라 같은 부드럽고 달콤한 향이 주를 이룹니다. 오크 숙성과의 궁합이 좋아 버번 스타일로 만들어지는 경우가 많으며, 특유의 크리미한 질감 덕분에 위스키를 처음 접하는 분께도 거부감 없이 권할 수 있습니다. 팹 반 윙클(Pappy Van Winkle) 시리즈가 이 스타일의 정점으로 꼽힙니다."},
{id:"Grain / Other",ko:"그레인 & 기타",desc:"보리 맥아 외의 곡물을 주로 연속식 증류기로 증류한 그레인 위스키와, 일반적인 몰트·블렌디드·버번·라이·밀 분류에 넣기 어려운 기타 스타일을 포함합니다. 대체로 깔끔하고 가벼운 스피릿 캐릭터가 중심입니다."}

{id:"Scotland / All Regions",ko:"스코틀랜드 / 전 지역",group:"SCOTLAND",desc:"여러 스코틀랜드 지역의 몰트 또는 그레인 원액을 블렌딩한 제품군입니다. 블렌디드 스카치뿐 아니라 블렌디드 몰트까지 포함하는 넓은 분류입니다."},

{id:"USA / Tennessee",ko:"미국 / 테네시",group:"USA",desc:"단풍나무 숯 여과 과정을 반드시 거치는 위스키로, 일반 버번보다 단맛이 정제되고 매끄러운 감칠맛을 냅니다."},

{id:"Ireland",ko:"아일랜드",group:"TRADITIONAL",desc:"위스키의 발상지 중 하나로, 주로 3회 증류를 거쳐 지극히 부드럽고 화사하며 달콤한 풍미를 냅니다."},
{id:"Canada",ko:"캐나다",group:"TRADITIONAL",desc:"호밀 캐릭터가 중요한 전통을 갖고 있지만, 실제로는 옥수수·호밀·보리 등 다양한 원액을 블렌딩하는 경우가 많습니다. 전반적으로 부드럽고 가볍고 깔끔한 스타일이 중심입니다."},

{id:"New World / Taiwan",ko:"뉴월드 / 대만",group:"NEW WORLD",desc:"고온다습한 기후로 오크통 숙성이 빠르며, 숙성 연수는 짧지만 폭발적인 풍미를 보여줍니다. 카발란이 세계적 명성을 얻었습니다."},

{id:"New World / Australia",ko:"뉴월드 / 호주",group:"NEW WORLD",desc:"혁신적인 기후와 기술로 급부상한 신흥 위스키 강국입니다. 와인 캐스크를 활용한 독창적인 스타일이 주목받습니다."},
{id:"New World / Israel",ko:"뉴월드 / 이스라엘",group:"NEW WORLD",desc:"사막 기후를 역이용한 빠른 숙성으로 강렬하고 개성 있는 위스키를 생산합니다. M&H가 세계 대회에서 수상하며 주목받았습니다."},

{id:"New World / Other",ko:"뉴월드 / 기타",group:"NEW WORLD",desc:"덴마크, 프랑스 등 기타 뉴월드 위스키 생산국으로, 지역 곡물과 기후적 특성을 살린 개성 있는 위스키를 만듭니다."}

subs:[
{id:"Floral & Herbal",ko:"꽃향 & 허브",desc:"꽃다발, 말린 꽃잎, 라벤더, 자스민처럼 은은하고 화사한 향과 민트, 풀잎, 허브티 같은 싱그러운 향을 함께 묶은 계열입니다. 맛이 무겁기보다는 향이 가볍고 깨끗하게 올라오는 편이라, 섬세하고 산뜻한 위스키를 찾는 손님에게 설명하기 좋습니다. 일본 위스키나 로우랜드, 일부 스페이사이드에서 자주 느껴집니다."},
{id:"Spicy & Aromatic",ko:"스파이시 & 향신료",desc:"입안이 맵다는 뜻보다는 후추, 시나몬, 생강, 정향, 육두구 같은 향신료성 향과 알싸한 자극을 말합니다. 특히 라이 위스키, 고도수 버번, 오크 영향이 강한 위스키에서 잘 나타나며, 마신 뒤 혀와 목 안쪽에 따뜻하고 또렷한 자극이 남는 경우가 많습니다. 단맛만 있는 위스키보다 힘 있고 선명한 인상을 줄 때 이 축으로 보면 됩니다."},
{id:"Winey & Tannic",ko:"와인향 & 탄닌",desc:"레드 와인, 포트 와인, 진한 포도 껍질, 베리류의 산미와 함께 입안을 살짝 조이는 떫은 느낌이 있는 계열입니다. 여기서 탄닌은 포도 껍질이나 오크에서 오는 드라이한 질감으로, 단순히 달콤한 과일향과는 다르게 조금 더 성숙하고 진한 인상을 줍니다. 와인 캐스크, 포트 캐스크, 레드와인 피니시 위스키를 설명할 때 유용합니다."},
{id:"Chocolate & Coffee",ko:"초콜릿 & 커피",desc:"다크초콜릿, 카카오, 에스프레소, 로스팅 원두처럼 달콤함과 쌉싸름함이 같이 있는 묵직한 계열입니다. 과일향처럼 상큼하게 퍼지기보다는 입안 아래쪽에 진하게 깔리고, 디저트·커피·카카오닙스 같은 인상을 줍니다. 셰리 캐스크, 스타우트 캐스크, 오래 숙성된 버번이나 몰트에서 자주 느껴집니다."},
{id:"Fruity & Tropical",ko:"과일 & 열대과일",desc:"사과, 배, 복숭아 같은 밝은 과일향부터 망고, 바나나, 파인애플, 패션프루트 같은 열대과일 향까지 포함하는 넓은 계열입니다. 산뜻하고 달콤한 첫인상을 주기 쉬워 위스키를 어렵게 느끼는 손님에게 설명하기 가장 좋은 축입니다. 단, 말린 과일이나 셰리의 진득한 과일감은 별도의 '말린 과일 & 셰리' 축으로 구분합니다."},
{id:"Sweet Pastry & Honey",ko:"페이스트리 & 꿀",desc:"꿀, 바닐라, 버터, 메이플시럽, 캐러멜, 갓 구운 빵이나 페이스트리처럼 부드럽고 달콤한 계열입니다. 과일의 상큼함보다는 베이커리·디저트·시럽 같은 편안한 단맛에 가깝고, 입문자가 가장 부담 없이 이해하기 쉽습니다. 엑스버번 캐스크, 버번, 블렌디드 스카치에서 자주 보이는 친근한 스타일입니다."},
{id:"Citrus & Zesty",ko:"시트러스 & 상큼함",desc:"레몬, 라임, 오렌지 껍질, 자몽처럼 새콤하고 밝게 튀는 향을 말합니다. 'Zesty'는 과즙 자체보다 껍질을 비틀었을 때 나는 상큼하고 살짝 쌉싸름한 오일 향에 가깝습니다. 전체 인상을 가볍고 깨끗하게 만들어주기 때문에 식전주 느낌이나 하이볼 적합성을 설명할 때도 좋습니다."},
{id:"Nutty & Toasty",ko:"견과 & 구운 향",desc:"구운 아몬드, 호두, 헤이즐넛, 땅콩버터, 토스트, 볶은 곡물처럼 고소하고 살짝 구운 느낌이 있는 계열입니다. 단맛이 있어도 설탕처럼 직선적인 단맛이 아니라, 볶음·구움·견과류에서 오는 고소함이 중심입니다. 오크 숙성, 셰리 숙성, 몰트의 구수함이 만날 때 자주 나타납니다."},
{id:"Malty & Cereal",ko:"몰트 & 곡물",desc:"보리, 맥아, 오트밀, 콘플레이크, 곡물빵처럼 위스키의 원료에서 오는 구수하고 담백한 계열입니다. 화려한 과일향이나 진한 오크향보다 곡물 본연의 고소함과 깨끗한 기본기가 먼저 느껴질 때 이 축에 가깝습니다. 싱글 몰트의 기본 캐릭터를 설명하거나, 과하게 달지 않은 위스키를 안내할 때 좋습니다."},
{id:"Woody & Oaky",ko:"나무향 & 오크",desc:"오크통에서 오는 나무 향, 바닐라, 톱밥, 시가 박스, 마른 나무, 탄닌감처럼 숙성감이 뚜렷한 계열입니다. 좋은 경우에는 고급 가구나 시가 박스처럼 깊고 우아하게 느껴지고, 강한 경우에는 떫거나 드라이하게 느껴질 수 있습니다. 오래 숙성된 위스키, 새 오크통 영향이 강한 버번, 우드 피니시 제품을 설명할 때 핵심이 됩니다."},
{id:"Dried Fruit & Sherry",ko:"말린 과일 & 셰리",desc:"건포도, 무화과, 자두, 대추, 잼, 흑설탕처럼 수분이 빠진 과일의 진득하고 농축된 단맛을 말합니다. 신선한 사과·배 같은 과일향보다 훨씬 어둡고 묵직하며, 셰리 캐스크 위스키에서 대표적으로 나타나는 캐릭터입니다. 달콤하지만 동시에 견과, 초콜릿, 향신료가 같이 붙어 복합적으로 느껴지는 경우가 많습니다."},
{id:"Earthy & Leather",ko:"흙내음 & 가죽",desc:"비 온 뒤의 흙, 이끼, 낙엽, 오래된 가죽, 담배잎, 창고 같은 어둡고 중후한 계열입니다. 처음 마시는 손님에게는 낯설 수 있지만, 숙성감이 깊거나 피트·셰리·오크가 복합적으로 섞인 위스키에서 매력으로 작용합니다. 밝고 달콤한 스타일보다 진지하고 어른스러운 분위기를 낼 때 이 축으로 설명하면 좋습니다."},
{id:"Savory & Umami",ko:"감칠맛 & 우마미",desc:"단맛이나 과일향이 아니라 소금기, 육향, 훈제 베이컨, 간장, 해조류, 버섯, 견과류의 짭짤함처럼 음식적인 감칠맛이 느껴지는 계열입니다. 특히 해안가 위스키, 일부 캠벨타운·아일라 위스키, 오일리한 몰트에서 두드러질 수 있습니다. 페어링을 붙였을 때 고기, 치즈, 해산물과 연결하기 좋은 축입니다."}
]},
{num:"⑤",id:"str",label:"Strength",ko:"알코올 도수",short:"ABV 볼륨과 타격감의 강도",desc:"위스키의 물리적인 강도와 알코올 볼륨(ABV)입니다. 도수가 높을수록 향의 밀도가 빽빽하고 타격감이 강해집니다.",
subs:[
{id:"Standard",ko:"기본 도수 · 40~43%",desc:"가장 부드럽고 편안하게 마실 수 있도록 물을 타서 도수를 낮춘 입문용/데일리 체급입니다. 알코올 자극이 적어 위스키 본연의 향을 쉽게 탐색할 수 있으며 하이볼로도 부담이 없습니다."},
{id:"Full Strength",ko:"강화 도수 · 44~49%",desc:"위스키 매니아들이 가장 선호하는 44~49.9% 대역입니다. 논 칠 필터(Non-Chill Filtered) 공정을 적용할 수 있는 마지노선 도수(주로 46%)가 이 체급에 속합니다."},
{id:"High Proof / Cask Strength",ko:"고도수 원액 · 50%+",desc:"50% 이상의 고도수 제품군입니다. 일부는 캐스크 스트렝스이고, 일부는 병입 전 도수 조정을 거친 하이 프루프 제품입니다. 향의 밀도와 타격감이 강해 물을 조금씩 더하며 변화를 보기 좋습니다."}
]},
{num:"⑥",id:"bod",label:"Body & Texture",ko:"보디 & 텍스처",short:"입안의 무게감과 점성 — 순수한 촉각",desc:"입안에 위스키를 머금었을 때 느껴지는 물리적인 무게감과 점성입니다. 향이 아닌 오직 '촉각'에 집중한 분류입니다.",
subs:[
{id:"Light & Crisp",ko:"가볍고 청량한",desc:"점성이 낮아 물처럼 가볍게 흘러가며, 잔당감이나 끈적임 없이 깔끔하게 뚝 떨어지는 스타일입니다. 식전주로 좋으며 마신 뒤 입안이 개운합니다."},
{id:"Medium & Smooth",ko:"부드럽고 균형 잡힌",desc:"너무 가볍지도, 무겁지도 않은 완벽한 밸런스를 가집니다. 비단처럼 매끄럽고 균형 잡힌 텍스처를 선사하는 대다수 클래식 위스키의 기준점입니다."},
{id:"Rich & Oily",ko:"묵직하고 진한",desc:"점성이 높고 입안 전체를 오일로 코팅하듯 진득하게 감싸 안습니다. 목을 넘긴 후에도 길고 묵직한 여운(Finish)이 이어지는 헤비급 보디감입니다."}
]},
{num:"⑦",id:"peat",label:"Peat / Smoke",ko:"피트 & 스모크",short:"이탄 훈연 강도 — 가장 극명한 호불호",desc:"위스키 제조 시 보리를 말릴 때 이탄(Peat)을 태워 입힌 특유의 훈연 캐릭터입니다. 호불호가 가장 극명하게 갈리는 축입니다.",
subs:[
{id:"None",ko:"피트 없음",desc:"피트 훈연을 전혀 하지 않은 위스키입니다. 연기 맛이나 소독약 느낌이 전혀 없어, 곡물 고유의 단맛과 오크통 향만을 순수하게 즐길 수 있습니다."},
{id:"Light Smoke",ko:"은은한 훈연",desc:"아주 미미하게 배경에 깔린 수준의 피트감입니다. 바비큐 끝에 스치는 은은한 장작 느낌 정도로, 위스키의 복합성을 높여주는 조연 역할을 합니다."},
{id:"Medium Peat",ko:"중간 훈연",desc:"'피트 위스키구나!'를 직관적으로 인지할 수 있는 수준입니다. 스모키함이 메인 캐릭터 중 하나로 치고 나오며 오크통 풍미와 팽팽하게 맞섭니다."},
{id:"Heavy Peat",ko:"강한 훈연",desc:"캠프파이어 연기, 탄 장작, 재, 훈제 베이컨 같은 직관적인 '불 맛과 연기 향'이 폭발하는 스타일입니다. 피트 매니아들이 열광하는 직설적인 스모키의 정수입니다."},
{id:"Medicinal / Maritime",ko:"요오드 · 해풍향",desc:"요오드, 정로환, 소독약 같은 강렬한 페놀릭 아로마와 해풍의 짭조름한 소금기, 바다 내음이 뒤섞인 아일라 특유의 개성파 피트 스타일입니다. 처음에는 충격적이지만 중독성이 가장 강합니다."}
]}
];

function bottleSlug(name){
  return String(name||'').normalize('NFKD')
    .replace(/[’']/g,'').replace(/&/g,' and ')
    .replace(/[^A-Za-z0-9]+/g,'-').replace(/^-+|-+$/g,'').toLowerCase();
}
function searchThumbUrl(w){
  const q=BOTTLE_IMAGE_QUERY_OVERRIDES[w.name] || ((w.name||'')+' whisky bottle product image full bottle transparent');
  return `https://tse1.mm.bing.net/th?q=${encodeURIComponent(q)}&w=320&h=520&c=7&rs=1&p=0&o=5&pid=1.7`;
}
const USE_LOCAL_IMAGE_FIRST=false; // true로 바꾸면 bottle-images/*.webp 로컬 이미지를 우선 사용
function webBottleImageUrl(w){
  const q=(typeof BOTTLE_IMAGE_QUERY_OVERRIDES!=='undefined' && BOTTLE_IMAGE_QUERY_OVERRIDES[w.name])
    ? BOTTLE_IMAGE_QUERY_OVERRIDES[w.name]
    : ((w.name||'')+' whisky bottle product image full bottle transparent');
  return `https://tse1.mm.bing.net/th?q=${encodeURIComponent(q)}&w=360&h=560&c=7&rs=1&p=0&o=5&pid=1.7`;
}
function bottleImgUrl(w){
  if(w.img&&String(w.img).trim())return String(w.img).trim();
  const local=(BOTTLE_IMAGE_URLS&&BOTTLE_IMAGE_URLS[w.name]) ? BOTTLE_IMAGE_URLS[w.name] : `${IMAGE_BASE}${bottleSlug(w.name)}.${IMAGE_EXT}`;
  return USE_LOCAL_IMAGE_FIRST ? local : webBottleImageUrl(w);
}
function bottleImageHtml(w){
  const src=bottleImgUrl(w);
  const local=(BOTTLE_IMAGE_URLS&&BOTTLE_IMAGE_URLS[w.name]) ? BOTTLE_IMAGE_URLS[w.name] : `${IMAGE_BASE}${bottleSlug(w.name)}.${IMAGE_EXT}`;
  const web=webBottleImageUrl(w);
  return `<div class="bottle-img-wrap has-img">
    <img class="bottle-img" loading="lazy" referrerpolicy="no-referrer" src="${esc(src)}" alt="${esc(w.name)} bottle image"
      onerror="if(!this.dataset.localtry && this.src!==location.origin+'/'+local){this.dataset.localtry='1';this.src='${esc(local)}';}else if(!this.dataset.webtry){this.dataset.webtry='1';this.src='${esc(web)}';}else{this.onerror=null;this.src='./bottle-images/_missing.svg';}" />
    <div class="bottle-img-missing" style="display:none;">이미지<br>확인 필요</div>
  </div>`;
}

function subMeta(k,v){
  const ax=AXES.find(a=>a.id===k);
  return ax&&ax.subs?ax.subs.find(s=>s.id===v):null;
}
function optionLabel(k,v){
  const s=subMeta(k,v);
  return s?`${v} · ${s.ko}`:v;
}
function valueText(k,v){
  const s=subMeta(k,v);
  return s?`${s.ko} · ${v}`:v;
}
function tagFor(k,v,bg,t){
  return tag(valueText(k,v),bg,t);
}
function migrateWhisky(w){
  const x={img:'',visible:true,...w,visible:w.visible!==false};
  FIELD_ORDER.forEach(k=>{if(VALUE_ALIASES[x[k]])x[k]=VALUE_ALIASES[x[k]];});
  if(PRODUCT_OVERRIDES[x.name])Object.assign(x,PRODUCT_OVERRIDES[x.name]);
  FIELD_ORDER.forEach(k=>{if(!OPTS[k].includes(x[k]))x[k]=OPTS[k][0];});

}

function normalizeSearchText(v){
  return String(v||'')
    .normalize('NFKC')
    .toLowerCase()
    .replace(/[’‘`´]/g,"'")
    .replace(/&/g,' and ')
    .replace(/[·・]/g,' ')
    .replace(/[()\[\]{}.,:;|/\\_-]+/g,' ')
    .replace(/\s+/g,' ')
    .trim();
}
function searchAliasesForValue(k,v){
  const bucket=SEARCH_TRANSLATIONS[k]||{};
  return bucket[v]||[];
}
function brandAliasesForName(name){
  const out=[];
  BRAND_KO_ALIASES.forEach(([rx,aliases])=>{if(rx.test(name))out.push(...aliases);});
  return out;
}
function searchBlob(w){
  const parts=[w.id,w.name,noteFor(w),w.visible===false?'비노출':'노출'];
  parts.push(...brandAliasesForName(w.name));
  FIELD_ORDER.forEach(k=>{
    parts.push(w[k],FLABELS[k]);
    parts.push(...searchAliasesForValue(k,w[k]));
    const s=subMeta(k,w[k]);
    if(s)parts.push(s.ko,s.desc,s.group||'');
  });
  return normalizeSearchText(parts.join(' '));
}
function matchesSearch(w,q){
  const query=normalizeSearchText(q);
  if(!query)return true;
  const blob=searchBlob(w);
  const blobTight=blob.replace(/\s+/g,'');
  const queryTight=query.replace(/\s+/g,'');
  if(blob.includes(query)||blobTight.includes(queryTight))return true;
  const tokens=query.split(' ').filter(Boolean);
  return tokens.every(t=>blob.includes(t)||blobTight.includes(t.replace(/\s+/g,'')));
}

function compactDesc(s){
  let t=String(s||'').replace(/\s+/g,' ').trim();
  if(!t)return '';
  const first=t.split(/(?<=다\.|요\.|임\.|니다\.)\s*/)[0] || t;
  t=first.trim();
  if(t.length>92)t=t.slice(0,92).replace(/\s+\S*$/,'')+'…';
  return t;
}

async function loadWs(){
  S.loading=true;render();
  try{
    const{data,error}=await db.from('whiskies').select('*').order('id');
    if(error)throw error;
    if(data&&data.length>0){
      S.ws=normalizeWs(data);
    }else{
      // 첫 실행: RAW 데이터를 Supabase에 시드
      const seed=rawSeed();
      const{error:ie}=await db.from('whiskies').insert(seed);
      if(ie)throw ie;
      S.ws=normalizeWs(seed);
    }
  }catch(e){
    console.error('Supabase loadWs 오류:',e);
    // 연결 실패 시 RAW 데이터로 폴백 (읽기 전용)
    S.ws=normalizeWs(rawSeed());
    S.supabaseError=true;
  }
  S.loading=false;render();
}

function cnt(axId,subId){return visibleWs().filter(w=>w[axId]===subId).length;}
function tag(label,bg,t){return`<span class="tag bilingual-tag" style="background:${bg};color:${t};">${label}</span>`;}
function strTag(v){const c=SC[v]||{bg:'#181818',t:'#444'};return tag(valueText('str',v),c.bg,c.t);}
function peatTag(v){const c=PC[v]||{bg:'#181818',t:'#444'};return tag(valueText('peat',v),c.bg,c.t);}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

/* ═══════════════ RENDER ═══════════════ */
function renderLoading(){
  return`<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;gap:20px;background:#050505;">
    ${LOGO_SM}
    <p class="pulse" style="font-size:13px;color:#666;letter-spacing:.28em;margin-top:10px;">LOADING DATA…</p>
  </div>`;
}
function renderSupabaseError(){
  if(!S.supabaseError)return'';
  return`<div style="margin:0 16px 12px;padding:12px 16px;border-radius:10px;border:1px solid rgba(216,58,99,.35);background:rgba(216,58,99,.08);">
    <p style="font-size:13px;color:#d83a63;letter-spacing:.12em;line-height:1.5;">⚠ Supabase 연결 오류 — 읽기 전용으로 작동 중입니다.<br>
    <span style="color:#9a6a72;">spirit-core.html 상단의 SUPABASE_URL / SUPABASE_ANON 값을 확인하세요.</span></p>
  </div>`;
}
function render(){
  const app=document.getElementById('app');
  if(!app)return;
  if(S.loading){app.innerHTML=renderLoading();return;}
  if(S.showPin){app.innerHTML=renderPin();return;}
  switch(S.scr){
    case'splash': app.innerHTML=renderSplash();break;
    case'axes':   app.innerHTML=renderAxes();break;
    case'sub':    app.innerHTML=renderSub();break;
    case'results':app.innerHTML=renderResults();break;
    case'admin':  app.innerHTML=renderAdmin();break;
    default:      app.innerHTML=renderSplash();
  }
  window.scrollTo(0,0);
}

function hdr(title,sub2,showBack,right){
  return`<div class="hdr">
${showBack?`<button onclick="goBack()" style="background:none;border:none;color:#a8a8a8;font-size:24px;cursor:pointer;padding:0 10px 0 0;line-height:1;flex-shrink:0;">&#8592;</button>`:''}
${HOME_LOGO}
<div style="flex:1;min-width:0;">
<p style="font-size:15px;color:#e4e4e4;letter-spacing:.22em;margin:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${title}</p>
${sub2?`<p style="font-size:13px;color:#8e8e8e;letter-spacing:.14em;margin:0;">${sub2}</p>`:''}
</div>
${right||''}
</div>`;
}

/* ─── SPLASH ─── */
function renderSplash(){
  return`<div class="fadein scr splash-screen" style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:32px;">
<div id="logoWrap" style="cursor:default;user-select:none;"
  onmousedown="startPress()" onmouseup="endPress()" ontouchstart="startPress()" ontouchend="endPress()">
${LOGO}
</div>
<div style="text-align:center;margin-top:24px;">
<div style="width:50px;height:1px;background:linear-gradient(to right,transparent,#d83a63,transparent);margin:0 auto 14px;"></div>
<p style="font-size:13.5px;color:#8e8e8e;letter-spacing:.42em;">WHISKY GUIDE</p>
</div>
<button onclick="S.scr='axes';render()" class="glint splash-cta"
  style="margin-top:54px;background:none;border:1px solid #363636;color:#d83a63;padding:14px 44px;font-size:14px;letter-spacing:.32em;cursor:pointer;transition:border-color .3s;"
  onmouseover="this.style.borderColor='#d83a63'" onmouseout="this.style.borderColor='#363636'">
  탐색 시작하기
</button>
<p class="pulse" style="margin-top:28px;font-size:13px;color:#666666;letter-spacing:.28em;">TOUCH TO EXPLORE</p>
</div>`;
}

function renderQuickSearchHtml(q){
  const query=String(q||'').trim();
  if(!query)return '';
  const allQuick=visibleWs().filter(w=>matchesSearch(w,query));
  const quick=allQuick.slice(0,80);
  return `<div style="margin:0 16px 12px;">
  <div style="display:flex;align-items:center;justify-content:space-between;margin:10px 0 8px;">
    <p style="font-size:13px;color:#8e8e8e;letter-spacing:.18em;">상위 검색 결과</p>
    <span style="font-size:14px;color:#d83a63;">${allQuick.length}종</span>
  </div>
  ${quick.length?quick.map(w=>`<div class="whisky-card search-card" onclick="openDetail(${w.id})" style="border:1px solid #1e1e1e;border-radius:4px;padding:13px 15px;background:#0e0e0e;margin-bottom:7px;">
    <div class="bottle-card">${bottleImageHtml(w)}<div>
    <p style="font-size:17px;color:#f1f1f1;margin-bottom:4px;">${esc(w.name)}</p>
    <p style="font-size:13px;color:#8e8e8e;margin-bottom:8px;">${valueText('ori',w.ori)}</p>
    ${noteHtml(w)}
    <div style="display:flex;flex-wrap:wrap;gap:4px;">
      ${tagFor('mat',w.mat,'#141414','#9a9a9a')}${tagFor('cask',w.cask,'#121008','#6a5832')}${tagFor('flv',w.flv,'#0c1208','#587040')}${strTag(w.str)}${tagFor('bod',w.bod,'#0e1318','#3c607a')}${peatTag(w.peat)}
    </div><p class="detail-hint">TAP FOR FULL PROFILE</p></div></div>
  </div>`).join(''):`<div style="text-align:center;padding:26px 12px;border:1px solid #1a1a1a;border-radius:4px;background:#0b0b0b;"><p style="font-size:14px;color:#444;letter-spacing:.18em;">검색 결과 없음</p></div>`}
  ${quick.length>=80?`<p style="font-size:13px;color:#555;text-align:center;margin-top:8px;">상위 80개만 표시됩니다. 검색어를 더 좁혀주세요.</p>`:''}
</div>`;
}
let searchInputTimer=null;
function updateQuickSearch(){
  const box=document.getElementById('quickSearchResults');
  if(box)box.innerHTML=renderQuickSearchHtml(S.q);
}
function handleSearchInput(el){
  S.q=el.value;
  if(S.searchComposing)return;
  clearTimeout(searchInputTimer);
  searchInputTimer=setTimeout(updateQuickSearch,60);
}
function handleSearchCompositionStart(){S.searchComposing=true;}
function handleSearchCompositionEnd(el){
  S.searchComposing=false;
  S.q=el.value;
  clearTimeout(searchInputTimer);
  updateQuickSearch();
}

/* ─── AXES ─── */
function renderAxes(){
  const quickHtml=`<div id="quickSearchResults">${renderQuickSearchHtml(S.q)}</div>`;
  const cards=AXES.map(a=>`
<div class="card" onclick="selAxis('${a.id}')" style="display:flex;align-items:center;gap:16px;">
  <span style="font-size:28px;color:#d83a63;flex-shrink:0;min-width:34px;">${a.num}</span>
  <div style="flex:1;min-width:0;">
    <div style="display:flex;align-items:baseline;gap:8px;margin-bottom:3px;flex-wrap:wrap;">
      <span style="font-size:18px;color:#f1f1f1;letter-spacing:.04em;">${a.label}</span>
      <span style="font-size:14px;color:#a6a6a6;">${a.ko}</span>
    </div>
    <p style="font-size:15px;color:#a6a6a6;line-height:1.45;margin:0;">${a.short}</p>
  </div>
  <span style="color:#777777;font-size:24px;flex-shrink:0;">&#8250;</span>
</div>`).join('');

/* ═══════════════ IMAGE UPLOAD ═══════════════ */
function handleImgUpload(input, dk){
  const file = input.files && input.files[0];
  if(!file) return;
  const MAX = 500;
  const QUALITY = 0.82;
  const reader = new FileReader();
  reader.onload = e => {
    const img = new Image();
    img.onload = () => {
      const scale = Math.min(1, MAX / Math.max(img.width, img.height));
      const w = Math.round(img.width * scale);
      const h = Math.round(img.height * scale);
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      const dataUrl = canvas.toDataURL('image/jpeg', QUALITY);
      S[dk].img = dataUrl;
      render();
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}
function refreshImgPreview(dk, url){
  S[dk].img = url;
  const wrap = document.getElementById('imgPreview_' + dk);
  if(!wrap) return;
  if(url){
    wrap.innerHTML = `<img src="${url.replace(/"/g,'&quot;')}" style="width:100%;height:100%;object-fit:contain;" onerror="this.style.display='none'"/>`;
  } else {
    wrap.innerHTML = `<span style="font-size:10px;color:#444;letter-spacing:.08em;text-align:center;line-height:1.4;">미리보기</span>`;
  }
}

function startEdit(id){
  const w=S.ws.find(x=>x.id===id);
  S.editId=id;S.editDraft={...w};S.addMode=false;render();
}
function confirmEdit(){
  if(!S.editDraft.name||!S.editDraft.name.trim()){alert('이름을 입력해주세요.');return;}
  const updated={...S.editDraft};
  S.ws=S.ws.map(w=>w.id===S.editId?updated:w);
  S.editId=null;render();
  (async()=>{
    try{
      const{error}=await db.from('whiskies').update(updated).eq('id',updated.id);
      if(error)throw error;
    }catch(e){console.error('confirmEdit 오류:',e);alert('저장 중 오류가 발생했습니다.');}
  })();
}
function toggleVisible(id){
  const w=S.ws.find(x=>x.id===id);
  if(!w)return;
  const newVis=w.visible!==false?false:true;
  S.ws=S.ws.map(x=>x.id===id?{...x,visible:newVis}:x);
  render();
  (async()=>{
    try{
      const{error}=await db.from('whiskies').update({visible:newVis}).eq('id',id);
      if(error)throw error;
    }catch(e){
      // 롤백
      S.ws=S.ws.map(x=>x.id===id?{...x,visible:w.visible}:x);
      render();console.error('toggleVisible 오류:',e);
    }
  })();
}
function delW(id){
  if(!confirm('이 위스키를 삭제하시겠습니까?'))return;
  const prev=[...S.ws];
  S.ws=S.ws.filter(w=>w.id!==id);
  if(S.editId===id)S.editId=null;
  render();
  (async()=>{
    try{
      const{error}=await db.from('whiskies').delete().eq('id',id);
      if(error)throw error;
    }catch(e){
      S.ws=prev;render();
      console.error('delW 오류:',e);alert('삭제 중 오류가 발생했습니다.');
    }
  })();
}
function confirmAdd(){
  if(!S.newDraft.name||!S.newDraft.name.trim()){alert('이름을 입력해주세요.');return;}
  const maxId=S.ws.reduce((m,w)=>Math.max(m,w.id),0);
  const newW={...S.newDraft,id:maxId+1,visible:true,note:''};
  S.ws.push(newW);
  S.newDraft={name:'',mat:'Single Malt',cask:'Ex-Bourbon / Virgin Oak',ori:'Scotland / Speyside',flv:'Fruity & Tropical',str:'Standard',bod:'Medium & Smooth',peat:'None',visible:true};
  S.addMode=false;render();
  (async()=>{
    try{
      const{error}=await db.from('whiskies').insert(newW);
      if(error)throw error;
    }catch(e){
      S.ws=S.ws.filter(w=>w.id!==newW.id);
      render();console.error('confirmAdd 오류:',e);alert('추가 중 오류가 발생했습니다.');
    }
  })();
}
function resetData(){
  if(!confirm('모든 데이터를 초기값으로 되돌리겠습니까?\n이 작업은 되돌릴 수 없습니다.'))return;
  const seed=rawSeed();
  S.ws=normalizeWs(seed);
  S.editId=null;S.addMode=false;
  render();
  (async()=>{
    try{
      await db.from('whiskies').delete().neq('id',0);
      const{error}=await db.from('whiskies').insert(seed);
      if(error)throw error;
    }catch(e){console.error('resetData 오류:',e);alert('초기화 중 오류가 발생했습니다.');}
  })();
}

loadWs();   // 비동기로 Supabase 데이터 불러오기
</script>
